# Test questions benchmark for Situation-Report Copilot
# Covers English, Nepali, Hindi, romanised, typos, follow-ups, ambiguous names, and unanswerable questions.

questions:
  # --- ENGLISH QUESTIONS ---
  - id: en_01
    question: "How many buildings were destroyed in the disaster?"
    language: "en"
    type: "standard"
    run: "test_A_trishuli"
    expected_tools: ["damage_summary"]
    expected_facts: ["damage.buildings.destroyed"]
    expected_numbers: [81]

  - id: en_02
    question: "How many settlements are cut off from vehicle access?"
    language: "en"
    type: "standard"
    run: "test_A_trishuli"
    expected_tools: ["cutoff_settlements"]
    expected_facts: ["cutoff.vehicle.optimistic.count"]
    expected_numbers: [44]

  - id: en_03
    question: "What is the total road length damaged or destroyed?"
    language: "en"
    type: "standard"
    run: "test_A_trishuli"
    expected_tools: ["damage_summary"]
    expected_facts: ["damage.roads.destroyed_km"]
    expected_numbers: [3.98]

  - id: en_04
    question: "How many bridges are destroyed?"
    language: "en"
    type: "standard"
    run: "test_A_trishuli"
    expected_tools: ["bridges_status"]
    expected_facts: ["damage.bridges.destroyed"]
    expected_numbers: [10]

  - id: en_05
    question: "Which road repair should rescue teams prioritize first?"
    language: "en"
    type: "standard"
    run: "test_A_trishuli"
    expected_tools: ["repair_priority"]
    expected_facts: ["repair.step_4.osm_id"]
    expected_numbers: [19, 939]

  - id: en_06
    question: "What is the status of Bahun Danda?"
    language: "en"
    type: "standard"
    run: "test_A_trishuli"
    expected_tools: ["settlement_status"]
    expected_facts: ["settlement.node_269569477.vehicle_status_opt"]
    expected_numbers: [10]

  - id: en_07
    question: "What is the nearest hospital or emergency facility for Bahun Danda?"
    language: "en"
    type: "standard"
    run: "test_A_trishuli"
    expected_tools: ["nearest_destination"]
    expected_facts: ["settlement.node_269569477.vehicle_pre_dist_km"]
    expected_numbers: [24.4]

  - id: en_08
    question: "What are the limitations of the satellite data regarding cloud cover?"
    language: "en"
    type: "standard"
    run: "test_A_trishuli"
    expected_tools: ["limitations"]
    expected_facts: ["limitations.cloud_covered_buildings"]
    expected_numbers: [1382]

