# Default configuration for Disaster Impact Assessment Pipeline (L0 - L5)
# Core pipeline runs with this default configuration.

case_study:
  name: "Disaster Impact Assessment"
  country: "Nepal"
  utm_crs: "auto"

orbit:
  max_lookback_days: 36
  preferred_cycle_days: 12

preprocessing:
  dem_buffer_km: 10.0
  filter_window_size: 5
  drainage_accumulation_threshold: 5000
  look_angle_deg: 38.0
  orbit_heading_deg: 350.0

detection:
  log_ratio_smooth_window: 5
  false_alarm_rate_pct: 1.0  # 1st percentile of control pair in HAND corridor
  max_hand_corridor_m: 40.0
  stream_proximity_m: 100.0
  min_area_pixels: 20
  simplify_tolerance_m: 8.0
  s2_pre_days: 15
  s2_post_days: 15
  s2_post_max_days: 45
  s2_max_scenes: 15
  s2_search_timeout_s: 60.0
  s2_scene_timeout_s: 40.0
  s2_total_budget_s: 120.0
  min_control_clear_pixels: 500
  cloud_dilation_buffer_m: 60.0
  reach_length_m: 250.0
  inferred_hand_percentile: 90.0
  inferred_min_observed_pixels: 50
  building_buffer_m: 10.0
  building_damage_proximity_m: 50.0
  intact_min_post_ndvi: 0.40
  intact_max_abs_d_ndvi: 0.20
  min_abs_d_ndvi_floor: -0.20      # Debris flows completely strip vegetative canopy; seasonal phenology maintains |ΔNDVI| < 0.15
  min_d_bsi_floor: 0.18           # Bare gravel/boulder deposition elevates BSI by >= +0.18 relative to pre-event surface
  min_channel_cvm_floor: 0.20     # Catastrophic river channel bed scour vector magnitude exceeds 0.20 across reflective bands
  min_builtup_cvm_floor: 0.15     # Structural building collapse/rubble alters multi-spectral reflectance magnitude by >= 0.15
  seasonal_control_lookback_days: 365 # Evaluates control pair from identical calendar dates 1 year prior to capture seasonal phenology
  inferred_min_reach_fraction: 0.20 # Requires observed damage along at least 20% of reach length to prevent isolated false alarms from triggering HAND fill

damage_grading:
  building_overlap_pct: 50.0  # Footprint overlap with Class 2 for Destroyed (%)
  distance_damaged_m: 10.0    # Centroid/distance to Class 2 for Damaged (D1 m)
  distance_possibly_damaged_m: 30.0  # Centroid/distance to Class 2 for Possibly damaged (D2 m, D2 > D1)
  road_segment_length_m: 100.0  # Maximum length of road segments (m)
  bridge_distance_m: 30.0       # Proximity to Class 2/3 for bridges (D_bridge m)
  bridge_reach_radius_m: 100.0  # Proximity along crossed river reach for bridges (R m)

routing:
  buffer_km: 30.0
  max_snap_distance_m: 500.0
  dbscan_eps_m: 65.0
  dbscan_min_samples: 5
  named_place_max_distance_m: 500.0
  rural_roads_drivable: false
  construction_roads_passable: false
  snap_dead_end_nodes_m: 5.0
  vehicle_highways:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - unclassified
    - residential
    - service
    - motorway_link
    - trunk_link
    - primary_link
    - secondary_link
    - tertiary_link
  walking_highways_extra:
    - path
    - footway
    - track
    - steps
    - pedestrian
    - cycleway

performance:
  max_threads: 2
  enable_quicklooks: true
